# Stage 2: 8 s sequences (16 context steps), fine-tuned from stage 1 (paper: "fine-tuned with 8s sequences").
seed: 0
output: runs/stage2_8s
data:
  cache_root: cache/waymo_160x240
  split_file: splits/waymo_ds.json
  seq_frames: 80
  ctx_stride: 5
  num_target: 4
model:
  height: 160
  width: 240
  num_cams: 3
  patch: 8
  dim: 768
  depth: 12
  heads: 12
  visible_k: 3600
  max_objects: 32
  gaussians_per_token: 16
  grad_checkpoint: true
train:
  steps: 20000
  batch_size: 2          # per GPU
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 500
  lpips_after: 0
  grad_clip: 1.0
  num_workers: 6
  log_every: 20
  save_every: 500
  keep_every: 5000
