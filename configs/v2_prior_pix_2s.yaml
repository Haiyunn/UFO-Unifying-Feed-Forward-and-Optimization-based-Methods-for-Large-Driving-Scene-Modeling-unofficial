# UFO v2, stage 1 (2 s): depth prior (InfiniDepth + own-frame LiDAR, ufo/data/depth_prior.py)
# as a 10th pixel channel and as the new-token distance, pixel-aligned Gaussians
# (64 per 8x8 patch anchored on the prior), trained on Waymo + Argoverse together.
# Warm-start from the paper-faithful stage 1 (--init runs/stage1_2s/ckpt_038000.pt).
seed: 0
output: runs/v2_prior_pix_2s
data:
  sources:
    - {name: waymo, cache_root: cache/waymo_160x240, split_file: splits/waymo_ds.json}
    - {name: argoverse, cache_root: cache/argoverse_160x240, split_file: splits/argoverse.json}
  seq_frames: 20
  ctx_stride: 5
  num_target: 4
model:
  height: 160
  width: 240
  num_cams: 3
  patch: 8
  dim: 768
  depth: 12
  heads: 12
  visible_k: 3600
  max_objects: 32
  gaussians_per_token: 64
  depth_prior: true
  prior_residual: 1.0
  pixel_aligned: true
  grad_checkpoint: true
train:
  steps: 30000
  batch_size: 4          # per GPU
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 1000
  lpips_after: 0
  grad_clip: 1.0
  num_workers: 6
  log_every: 20
  save_every: 500
  keep_every: 5000
