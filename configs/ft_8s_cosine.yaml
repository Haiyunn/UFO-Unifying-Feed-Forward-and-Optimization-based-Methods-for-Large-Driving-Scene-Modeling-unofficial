# Fine-tune of the stage-1 (2 s) checkpoint for higher PSNR: 8 s sequences (16 recurrent
# steps, the paper's stage-2 recipe, fixes long-sequence drift) + cosine LR decay to lr_min.
seed: 0
output: runs/ft_8s_cosine
data:
  cache_root: cache/waymo_160x240
  split_file: splits/waymo_ds.json
  seq_frames: 80
  ctx_stride: 5
  num_target: 4
model:
  height: 160
  width: 240
  num_cams: 3
  patch: 8
  dim: 768
  depth: 12
  heads: 12
  visible_k: 3600
  max_objects: 32
  gaussians_per_token: 16
  grad_checkpoint: true
train:
  steps: 12000
  batch_size: 2          # per GPU
  lr: 5.0e-5
  lr_min: 1.0e-6
  schedule: cosine
  weight_decay: 0.05
  warmup_steps: 300
  lpips_after: 0
  grad_clip: 1.0
  num_workers: 6
  log_every: 20
  save_every: 500
  keep_every: 2000
